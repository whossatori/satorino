# satorino: Windows portable testing and optional release packages.
# Package jobs upload build artifacts for manual release assembly.
#
# Setup is copied from the Windows job in build.yml (MSVC environment via
# msvc-dev-cmd, clang-cl + llvm-rc + LLD, Qt 6.12.0 via install-qt-action
# incl. the forked aqtinstall that 6.12 needs, conan 2 dependencies,
# sccache/conan/Qt caches) with these test-build deviations:
#   - CHATTERINO_NO_AVIF_PLUGIN=ON : mandatory, conan pulls libavif and
#     cmake/AVIF.cmake contains the MAJOR_QT_VERSON typo (see
#     docs/SATORINO.md)
#   - CHATTERINO_UPDATER=OFF       : no satorino release feed exists
#   - crashpad OFF, LTO OFF        : faster test builds
#   - the zip carries a `modes` file containing "portable" next to
#     satorino.exe (src/common/Modes.cpp), so the build stores ALL
#     settings/caches/logs next to the exe and never reads or writes
#     the installed Satorino profile in %APPDATA%\satorino.
#   - the conan runtime DLLs (libssl-3-x64.dll, libcrypto-3-x64.dll) are
#     copied from build/bin into the package: satorino.exe imports them
#     directly and windeployqt does not deploy them. Upstream gets them via
#     conanfile.py, which also copies them into build/Chatterino2.

name: satorino Windows Test Build

on:
  workflow_dispatch:
    inputs:
      release_packages:
        description: Build Windows installer, Linux AppImage, and macOS DMG
        type: boolean
        default: false
  push:
    branches:
      - satorino

concurrency:
  group: satorino-windows-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CHATTERINO_REQUIRE_CLEAN_GIT: On
  CONAN_VERSION: 2.28.1
  C2_APP_EXECUTABLE: satorino

jobs:
  build-windows-x64:
    name: "Windows x64 portable test build"
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0 # allows cmake's git describe to find the hash
          persist-credentials: false

      - name: Install Qt6
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          cache: true
          cache-key-prefix: ${{ runner.os }}-QtCache-6.12.0-v2
          modules: qtimageformats qtcharts
          version: "6.12.0"
          # https://github.com/miurahr/aqtinstall/pull/1052
          aqtsource: git+https://github.com/pzhlkj6612/forked-aqtinstall@7b60b0f64e2fdd28552d7603e9831b027172afb0

      - name: Enable Developer Command Prompt
        uses: Chatterino/msvc-dev-cmd@24444121cb2805a7adbd23d0f4455d0916af896b # v2.0.7
        with:
          arch: x64

      - name: Setup sccache
        # sccache v0.7.4
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          variant: sccache
          # only save caches from push builds, not manual dispatch runs
          save: ${{ github.event_name == 'push' }}
          key: satorino-windows-test-${{ runner.os }}-${{ runner.arch }}-qt-6.12.0
          restore-keys: |
            satorino-windows-test-${{ runner.os }}-${{ runner.arch }}-qt-6.12.0
            sccache-build-${{ runner.os }}-${{ runner.arch }}-6.12.0

      - name: Cache conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-conan-user-${{ hashFiles('**/conanfile.py') }}-QT6
          path: ~/.conan2/

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Clang
        uses: Nerixyz/install-llvm-action@4af87402e075801cb1ba829dcee5bfafdc733616
        with:
          version: 22

      - name: Install and Setup Conan
        run: |
          pip install conan==${{ env.CONAN_VERSION }}
          conan --version
          conan profile detect -f
        shell: bash

      - name: Install dependencies
        run: |
          mkdir build
          cd build
          conan install .. \
              -s build_type=RelWithDebInfo \
              -c tools.cmake.cmaketoolchain:generator="Ninja" \
              -b missing \
              --output-folder=. \
              -o with_openssl3=True
          conan cache clean --source --build --download "*"
        shell: bash

      - name: Build
        shell: pwsh
        run: |
          cd build
          # GitHub windows runners ship Chocolatey `ccache`, which CMake picks up as
          # CMAKE_RC_COMPILER_LAUNCHER. That wraps `cmake -E cmake_llvm_rc` and breaks
          # windows.rc via ccache @response files. Upstream uses llvm-rc + sccache for
          # CXX only; strip ccache and clear launcher env so RC stays unwrapped.
          $env:Path = (
            $env:Path -split ';' |
            Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'ccache.exe')) }
          ) -join ';'
          Remove-Item Env:CMAKE_RC_COMPILER_LAUNCHER -ErrorAction SilentlyContinue
          Remove-Item Env:CMAKE_CXX_COMPILER_LAUNCHER -ErrorAction SilentlyContinue
          Remove-Item Env:CMAKE_C_COMPILER_LAUNCHER -ErrorAction SilentlyContinue
          cmake `
              -G Ninja `
              -DCMAKE_CXX_COMPILER=clang-cl `
              -DCMAKE_C_COMPILER=clang-cl `
              -DCMAKE_RC_COMPILER=llvm-rc `
              -DCMAKE_LINKER_TYPE=LLD `
              -DCMAKE_BUILD_TYPE=RelWithDebInfo `
              -DCMAKE_TOOLCHAIN_FILE="conan_toolchain.cmake" `
              -DUSE_PRECOMPILED_HEADERS=ON `
              -DBUILD_WITH_CRASHPAD=OFF `
              -DCHATTERINO_LTO=OFF `
              -DCHATTERINO_FORCE_LTO=OFF `
              -DFORCE_JSON_GENERATION=Off `
              -DSKIP_JSON_GENERATION=Off `
              -DCHATTERINO_NIGHTLY_BUILD=Off `
              -DCHATTERINO_NO_AVIF_PLUGIN=ON `
              -DCHATTERINO_UPDATER=OFF `
              -DCHATTERINO_SPELLCHECK=On `
              ..
          ninja

      - name: Package portable zip
        shell: pwsh
        working-directory: build
        run: |
          windeployqt bin/${{ env.C2_APP_EXECUTABLE }}.exe --release --no-compiler-runtime --no-translations --no-opengl-sw --dir satorino/ --force-openssl
          cp bin/${{ env.C2_APP_EXECUTABLE }}.exe satorino/
          # conan runtime DLLs (OpenSSL etc.) - satorino.exe imports these directly
          Copy-Item bin\*.dll satorino\ -Force
          ..\.CI\deploy-crt.ps1 satorino
          # Portable mode (src/common/Modes.cpp): a `modes` file containing the
          # line "portable" next to satorino.exe keeps ALL settings, caches and
          # logs next to the exe.
          Write-Output portable | Out-File satorino/modes -Encoding ASCII
          7z a satorino-windows-x64-portable.zip satorino/
          Get-Content satorino/modes
          7z l satorino-windows-x64-portable.zip | Select-Object -First 40

      - name: Verify package contents
        shell: pwsh
        working-directory: build
        run: |
          $required = @(
            'satorino.exe', 'modes',
            'libssl-3-x64.dll', 'libcrypto-3-x64.dll',
            'Qt6Core.dll', 'Qt6Charts.dll',
            'platforms/qwindows.dll', 'tls/qopensslbackend.dll', 'imageformats/qwebp.dll',
            'VCRUNTIME140.dll', 'MSVCP140.dll'
          )
          # Test-Path is case-insensitive on Windows - compare against the
          # real file names case-exactly: the binary must be satorino.exe
          # and the OpenSSL DLLs must be present under their exact names.
          $root = (Resolve-Path satorino).Path
          $files = Get-ChildItem -Recurse -File satorino |
              ForEach-Object { $_.FullName.Substring($root.Length + 1) -replace '\\', '/' }
          $missing = @($required | Where-Object { $files -cnotcontains $_ })
          if ($missing) {
            Write-Error ("Missing from package (case-exact): " + ($missing -join ', '))
            exit 1
          }
          Get-ChildItem satorino | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: satorino-windows-x64-portable
          path: build/satorino
          if-no-files-found: error

      - name: Build and verify Windows installer
        if: inputs.release_packages
        shell: pwsh
        timeout-minutes: 15
        run: |
          $toolDir = Join-Path $env:RUNNER_TEMP 'satorino-inno-6.7.3'
          $download = "$toolDir.exe"
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $download
          $expected = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          if ((Get-FileHash $download -Algorithm SHA256).Hash -ne $expected) {
            throw 'Inno Setup download checksum mismatch.'
          }
          $toolSetup = Start-Process -FilePath $download -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER',
            '/PORTABLE=1', ('/DIR="' + $toolDir + '"')
          ) -WindowStyle Hidden -Wait -PassThru
          if ($toolSetup.ExitCode -ne 0) { throw "Inno Setup install failed: $($toolSetup.ExitCode)" }

          $payload = (Resolve-Path 'build/satorino').Path
          $version = (Get-Item "$payload/satorino.exe").VersionInfo.FileVersion
          $output = New-Item -ItemType Directory -Path 'build/release'
          & "$toolDir/ISCC.exe" "/DAppSourceDir=$payload" "/DAppVersion=$version" "/O$($output.FullName)" '.CI/satorino-release.iss'
          if ($LASTEXITCODE -ne 0) { throw "Installer compiler failed: $LASTEXITCODE" }

          $installed = Join-Path $env:RUNNER_TEMP 'satorino-install-test'
          $setup = Start-Process -FilePath "$($output.FullName)/satorino-windows-x64-setup.exe" -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="' + $installed + '"')
          ) -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Satorino setup failed: $($setup.ExitCode)" }
          if (Test-Path "$installed/modes") { throw 'Setup installed the portable-mode marker.' }
          if ((Get-FileHash "$installed/satorino.exe").Hash -ne (Get-FileHash "$payload/satorino.exe").Hash) {
            throw 'Setup installed a different executable from the packaged build.'
          }
          $app = Start-Process -FilePath "$installed/satorino.exe" -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 10
            if ($app.HasExited) { throw "Installed app exited during startup: $($app.ExitCode)" }
            if (!(Test-Path "$env:APPDATA/satorino/Settings" -PathType Container)) {
              throw 'Installed app did not create its own settings directory.'
            }
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id -Force }
          }

      - name: Upload Windows installer
        if: inputs.release_packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: satorino-windows-x64-setup
          path: build/release/satorino-windows-x64-setup.exe
          if-no-files-found: error

      - name: Smoke test (launch, must stay alive 10 s)
        # Runs AFTER the upload, so a failing test can never cost the zip.
        #
        # Deliberately NOT "--version": on Windows that path calls
        # attachToConsole() (src/util/AttachToConsole.cpp), which passes a
        # null FILE** to freopen_s. The CRT's invalid-parameter handler then
        # kills the process with 0xC0000409 whenever a parent console exists
        # (as on this runner). That is upstream behaviour, not a packaging
        # fault, so it can never pass here.
        #
        # Instead start the real GUI path and require the process to still
        # be alive after 10 s. A missing DLL (exit 0xC0000135), a Qt platform
        # plugin failure or any startup crash ends the process well before.
        # QT_FORCE_STDERR_LOGGING makes the GUI-subsystem exe write Qt
        # messages to the redirected stderr so a failure explains itself.
        #
        # continue-on-error: this step is new and has never run on a runner.
        # Set it to false once it has passed once.
        continue-on-error: true
        shell: pwsh
        working-directory: build
        timeout-minutes: 3
        run: |
          $env:QT_FORCE_STDERR_LOGGING = '1'
          $exe = (Resolve-Path 'satorino/satorino.exe').Path
          $p = Start-Process -FilePath $exe -PassThru `
              -RedirectStandardOutput smoke-stdout.txt `
              -RedirectStandardError smoke-stderr.txt
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            Write-Host '--- stderr ---'
            Get-Content smoke-stderr.txt -ErrorAction SilentlyContinue
            Write-Host '--- stdout ---'
            Get-Content smoke-stdout.txt -ErrorAction SilentlyContinue
            Write-Error ('satorino.exe exited early, code 0x{0:X8}' -f $p.ExitCode)
            exit 1
          }
          Write-Host 'satorino.exe still running after 10 s - OK'
          Stop-Process -Id $p.Id -Force
          Write-Host '--- stderr (first 40 lines) ---'
          Get-Content smoke-stderr.txt -TotalCount 40 -ErrorAction SilentlyContinue

  package-linux-x64:
    if: inputs.release_packages
    name: Linux x86-64 AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Install Linux build and Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-14 ninja-build libboost-json-dev libboost-filesystem-dev libgl-dev libnotify-dev \
            libsecret-1-dev libssl-dev libfuse2t64 libxcb-cursor0 libxcb-xinerama0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xkb1 \
            libx11-xcb1 patchelf xvfb xauth

      - name: Install Qt6
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          cache: true
          cache-key-prefix: ${{ runner.os }}-QtCache-6.12.0-v2
          modules: qtimageformats qtcharts
          version: "6.12.0"
          # https://github.com/miurahr/aqtinstall/pull/1052
          aqtsource: git+https://github.com/pzhlkj6612/forked-aqtinstall@7b60b0f64e2fdd28552d7603e9831b027172afb0

      - name: Build Satorino
        env:
          CXX: g++-14
          CXXFLAGS: -fno-sized-deallocation
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPAJLADA_SETTINGS_USE_BOOST_FILESYSTEM=ON \
            -DUSE_PRECOMPILED_HEADERS=ON \
            -DCHATTERINO_LTO=OFF \
            -DBUILD_WITH_CRASHPAD=OFF \
            -DCHATTERINO_NO_AVIF_PLUGIN=ON \
            -DCHATTERINO_UPDATER=OFF \
            -DCHATTERINO_NIGHTLY_BUILD=OFF \
            -DFORCE_JSON_GENERATION=OFF
          cmake --build build --parallel 3

      - name: Package and verify AppImage
        working-directory: build
        run: |
          sh ../.CI/CreateAppImage.sh
          ./satorino-x86_64.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/satorino
          test -n "$(find squashfs-root -name libqwebp.so -print -quit)"
          test -n "$(find squashfs-root -name libqxcb.so -print -quit)"
          # Test the X11 platform shipped in the AppImage with a virtual display.
          env -u QT_PLUGIN_PATH -u LD_LIBRARY_PATH \
            QT_QPA_PLATFORM=xcb XDG_DATA_HOME="$RUNNER_TEMP/satorino-smoke-data" \
            xvfb-run -a ./squashfs-root/AppRun --version
          mv satorino-x86_64.AppImage satorino-linux-x86_64.AppImage

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: satorino-linux-x86_64
          path: build/satorino-linux-x86_64.AppImage
          if-no-files-found: error

  package-macos:
    if: inputs.release_packages
    name: macOS universal DMG
    runs-on: macos-15
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Install Qt6
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          cache: true
          cache-key-prefix: ${{ runner.os }}-QtCache-6.12.0-v2
          modules: qtimageformats qtcharts
          version: "6.12.0"
          # https://github.com/miurahr/aqtinstall/pull/1052
          aqtsource: git+https://github.com/pzhlkj6612/forked-aqtinstall@7b60b0f64e2fdd28552d7603e9831b027172afb0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install macOS build dependencies
        run: |
          brew install rapidjson ninja
          python -m pip install "conan==$CONAN_VERSION"
          conan profile detect --force

      - name: Build Satorino for Apple silicon and Intel
        run: |
          conan install . -of build -s build_type=Release -s 'arch=armv8|x86_64' \
            -c tools.cmake.cmaketoolchain:generator=Ninja -b missing -o with_openssl3=True
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/build/conan_toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES='arm64;x86_64' \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            -DUSE_PRECOMPILED_HEADERS=OFF \
            -DCHATTERINO_LTO=OFF \
            -DBUILD_WITH_CRASHPAD=OFF \
            -DCHATTERINO_NO_AVIF_PLUGIN=ON \
            -DCHATTERINO_UPDATER=OFF \
            -DCHATTERINO_NIGHTLY_BUILD=OFF \
            -DFORCE_JSON_GENERATION=OFF
          cmake --build build --parallel 2

      - name: Package and verify DMG
        working-directory: build
        env:
          MACOS_CODESIGN_CERTIFICATE: "-"
        run: |
          app=satorino.app
          cp ../LICENSE "bin/$app/Contents/Resources/LICENSE.txt"
          ../.CI/MacDeploy.sh -libpath="$PWD/bin"
          test -f "$app/Contents/PlugIns/imageformats/libqwebp.dylib"
          for file in \
            "$app/Contents/MacOS/satorino" \
            "$app/Contents/Frameworks/libssl.3.dylib" \
            "$app/Contents/Frameworks/libcrypto.3.dylib" \
            "$app/Contents/PlugIns/imageformats/libqwebp.dylib"; do
            lipo "$file" -verify_arch arm64 x86_64
          done
          codesign --verify --deep --strict "$app"
          mkdir dmg
          ditto "$app" dmg/Satorino.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname Satorino -srcfolder dmg -format UDZO satorino-macos-universal.dmg
          hdiutil verify satorino-macos-universal.dmg

      - name: Upload macOS DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: satorino-macos-universal
          path: build/satorino-macos-universal.dmg
          if-no-files-found: error
